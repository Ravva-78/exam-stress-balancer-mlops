version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Exam Stress Balancer — Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Services:
#   api       — FastAPI prediction server
#   mlflow    — Experiment tracking UI
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Prediction API ─────────────────────────────────────────────────
  api:
    build:
      context: ..            # project root
      dockerfile: docker/Dockerfile
    container_name: exam_stress_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../models:/app/models          # persist trained model artefacts
      - ../data:/app/data
      - ../evaluations:/app/evaluations
      - ../logs:/app/logs
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_WORKERS=2
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - esb_net

  # ── MLflow Tracking Server ────────────────────────────────────────────────
  mlflow:
    image: python:3.11-slim
    container_name: exam_stress_mlflow
    restart: unless-stopped
    command: >
      sh -c "pip install --quiet mlflow &&
             mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri /mlflow/db
               --default-artifact-root /mlflow/artifacts"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    networks:
      - esb_net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mlflow_data:
    driver: local

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  esb_net:
    driver: bridge
