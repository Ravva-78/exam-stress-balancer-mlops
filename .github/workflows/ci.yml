name: CI — Exam Stress Balancer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      - name: Verify models exist
        run: |
          python -c "
          from src.utils.helpers import load_pickle
          q = load_pickle('models/q_learning.pkl')
          s = load_pickle('models/sarsa.pkl')
          print(f'Q-Learning: {len(q)} states')
          print(f'SARSA: {len(s)} states')
          assert len(q) > 200, 'Q-table undertrained'
          assert len(s) > 200, 'SARSA table undertrained'
          print('Model verification passed')
          "